<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="larana-master" data-pptx-master-name="Larana" data-pptx-layout="02_chapter" data-pptx-layout-name="Section Divider">
  <!-- Larana - 02 Section divider: off-white top band with the section header, solid green lower field with lead copy and the reversed 3-dot mark -->

  <rect id="master-bg" width="1280" height="720" fill="#FFFFFF" data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="divider-top" width="1280" height="286.7" fill="#FAFAFA" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="divider-bottom" y="286.7" width="1280" height="433.3" fill="#16A647" data-pptx-layer="layout" data-pptx-editable="false"/>

  <g id="chapter-eyebrow">
    <text x="640" y="109.2" text-anchor="middle"
          font-family="'Pretendard ExtraBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="24" letter-spacing="2.9" fill="#16A647">{{CHAPTER_NUM}}</text>
  </g>

  <g id="title-slot" data-pptx-placeholder="title" data-pptx-placeholder-bounds="160 129 960 71">
    <text id="title-carrier" data-pptx-placeholder-carrier="true" x="640" y="185.7" text-anchor="middle"
          font-family="'Pretendard Black', Pretendard, 'Malgun Gothic', sans-serif" font-size="58.7" letter-spacing="-1.2" fill="#1F1F1F">{{CHAPTER_TITLE}}</text>
  </g>

  <g id="body-slot" data-pptx-placeholder="body" data-pptx-placeholder-idx="2" data-pptx-placeholder-bounds="200 340 880 136">
    <text id="body-carrier" data-pptx-placeholder-carrier="true" x="640" y="359" text-anchor="middle"
          font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="20" fill="#FFFFFF">{{CHAPTER_DESC}}</text>
  </g>

  <g id="brand-mark">
    <circle cx="596.7" cy="573.3" r="30" fill="#FFFFFF"/>
    <circle cx="640" cy="573.3" r="30" fill="#FFFFFF"/>
    <circle cx="683.3" cy="573.3" r="30" fill="#FFFFFF"/>
  </g>

  <g id="page-foot">
    <text x="640" y="683" text-anchor="middle"
          font-family="'Pretendard Medium', Pretendard, 'Malgun Gothic', sans-serif" font-size="14.7" fill="#FFFFFF">{{TAGLINE}}</text>
  </g>
</svg>
