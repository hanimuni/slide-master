<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="larana-master" data-pptx-master-name="Larana" data-pptx-layout="04_ending" data-pptx-layout-name="Closing">
  <!-- Larana - 04 Closing: oversized mint blob, tilted device on the right, big headline with 3-dot mark and outlined chips -->

