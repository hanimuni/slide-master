<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="growup-master" data-pptx-master-name="GrowUp" data-pptx-layout="03i_content_impact" data-pptx-layout-name="Content Impact Cards">
  <!-- GrowUp - 03i Three tall warm cards, left-aligned copy: solid purple icon disc, purple heading, body, bullet list -->

  <defs>
    <filter id="shadow-card" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6.7" flood-color="#C9BEEA" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect id="master-bg" width="1280" height="720" fill="#FFFFFF" data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="panel-1" x="86.4" y="211.2" width="337.1" height="412.8" rx="17.3" fill="#FCEFE6" filter="url(#shadow-card)" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="panel-2" x="471.5" y="211.2" width="337.1" height="412.8" rx="17.3" fill="#FCEFE6" filter="url(#shadow-card)" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="panel-3" x="856.5" y="211.2" width="337.1" height="412.8" rx="17.3" fill="#FCEFE6" filter="url(#shadow-card)" data-pptx-layer="layout" data-pptx-editable="false"/>

  <g id="page-eyebrow">
