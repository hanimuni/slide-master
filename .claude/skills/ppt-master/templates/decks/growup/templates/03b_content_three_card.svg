<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="growup-master" data-pptx-master-name="GrowUp" data-pptx-layout="03b_content_three_card" data-pptx-layout-name="Content Three Card">
  <!-- GrowUp - 03b Three warm cards on white, lilac icon disc + purple card title -->

  <defs>
    <filter id="shadow-soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#C9BEEA" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect id="master-bg" width="1280" height="720" fill="#FFFFFF" data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="card-1-panel" x="86.4" y="216" width="337.1" height="403.2" rx="17.3" fill="#FCEFE6" filter="url(#shadow-soft)" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="card-2-panel" x="471.5" y="216" width="337.1" height="403.2" rx="17.3" fill="#FCEFE6" filter="url(#shadow-soft)" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="card-3-panel" x="856.5" y="216" width="337.1" height="403.2" rx="17.3" fill="#FCEFE6" filter="url(#shadow-soft)" data-pptx-layer="layout" data-pptx-editable="false"/>

  <g id="page-eyebrow">
    <text x="96" y="78.5" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16.7" font-weight="bold" letter-spacing="4" fill="#7C6BFF">{{EYEBROW}}</text>
  </g>

  <g id="title-slot" data-pptx-placeholder="title" data-pptx-placeholder-bounds="86 92 1104 86">
