    <circle cx="1025.0" cy="307.8" r="17.9" fill="none" stroke="#1F1B2E" stroke-width="3.0"/>
    <text x="1025" y="419.1" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="25.3" font-weight="bold" fill="#5A49C9">{{CARD_3_TITLE}}</text>
    <text x="1025" y="472.4" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="19.3" fill="#4A4658">{{CARD_3_BODY}}</text>
