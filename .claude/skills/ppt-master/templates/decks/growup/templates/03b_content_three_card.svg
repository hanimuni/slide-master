    <circle cx="254.9" cy="307.8" r="17.9" fill="none" stroke="#1F1B2E" stroke-width="3.0"/>
    <text x="254.9" y="419.1" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="25.3" font-weight="bold" fill="#5A49C9">{{CARD_1_TITLE}}</text>
    <text x="254.9" y="472.4" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="19.3" fill="#4A4658">{{CARD_1_BODY}}</text>
  </g>

  <g id="card-2">
    <circle cx="640" cy="312" r="52.8" fill="#EDEAFB"/>
    <circle cx="640.0" cy="307.8" r="17.9" fill="none" stroke="#1F1B2E" stroke-width="3.0"/>
    <text x="640" y="419.1" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="25.3" font-weight="bold" fill="#5A49C9">{{CARD_2_TITLE}}</text>
    <text x="640" y="472.4" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="19.3" fill="#4A4658">{{CARD_2_BODY}}</text>
  </g>

  <g id="card-3">
