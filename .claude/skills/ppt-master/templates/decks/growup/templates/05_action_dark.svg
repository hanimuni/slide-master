<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="growup-master" data-pptx-master-name="GrowUp" data-pptx-layout="05_action_dark" data-pptx-layout-name="Action Dark">
  <!-- GrowUp - 05 Dark action page: left ask cards, right numbered step ladder, contact footer. No card shadows on dark ground. -->

  <rect id="master-bg" width="1280" height="720" fill="#FFFFFF" data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="dark-ground" width="1280" height="720" fill="#241C45" data-pptx-layer="layout" data-pptx-editable="false"/>
  <circle id="dark-disc" cx="96" cy="768" r="336" fill="#2E2456" data-pptx-layer="layout" data-pptx-editable="false"/>

  <g id="page-eyebrow">
    <text x="96" y="91" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16.7" font-weight="bold" letter-spacing="4" fill="#B7A9FF">{{EYEBROW}}</text>
  </g>

  <g id="brand-mark">
