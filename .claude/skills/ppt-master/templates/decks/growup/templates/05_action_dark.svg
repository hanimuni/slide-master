    <text x="168" y="503.4" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="20.7" font-weight="bold" fill="#FFFFFF">{{ASK_3_TITLE}}</text>
    <text x="168" y="536.3" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#C9C2E8">{{ASK_3_BODY}}</text>
