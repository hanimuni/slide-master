    <text x="168" y="332.8" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#C9C2E8">{{ASK_1_BODY}}</text>
    <rect x="86.4" y="365.8" width="633.6" height="88.3" rx="11.5" fill="#33295E"/>
    <circle cx="127.7" cy="409.9" r="14.4" fill="#7C6BFF"/>
    <text x="168" y="401.7" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="20.7" font-weight="bold" fill="#FFFFFF">{{ASK_2_TITLE}}</text>
    <text x="168" y="434.6" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#C9C2E8">{{ASK_2_BODY}}</text>
