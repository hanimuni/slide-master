<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="growup-master" data-pptx-master-name="GrowUp" data-pptx-layout="02_chapter" data-pptx-layout-name="Chapter Divider">
  <!-- GrowUp - 02 Chapter divider (full purple field, two corner-clipped tonal discs) -->

  <rect id="master-bg" width="1280" height="720" fill="#FFFFFF" data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="chapter-ground" width="1280" height="720" fill="#7C6BFF" data-pptx-layer="layout" data-pptx-editable="false"/>
  <circle id="chapter-disc-tl" cx="144" cy="48" r="384" fill="#8A7BFF" data-pptx-layer="layout" data-pptx-editable="false"/>
  <circle id="chapter-disc-br" cx="1248" cy="720" r="336" fill="#6E5CF0" data-pptx-layer="layout" data-pptx-editable="false"/>

  <g id="chapter-eyebrow">
    <text x="640" y="220.6" text-anchor="middle"
          font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16.7" font-weight="bold" letter-spacing="4" fill="#E5E0FF">{{CHAPTER_NUM}}</text>
  </g>

  <g id="title-slot" data-pptx-placeholder="title" data-pptx-placeholder-bounds="160 240 960 86">
    <text id="title-carrier" data-pptx-placeholder-carrier="true" x="640" y="296.5" text-anchor="middle"
          font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="53.3" font-weight="bold" fill="#FFFFFF">{{CHAPTER_TITLE}}</text>
  </g>

  <g id="body-slot" data-pptx-placeholder="body" data-pptx-placeholder-idx="2" data-pptx-placeholder-bounds="230 370 820 115">
    <text id="body-carrier" data-pptx-placeholder-carrier="true" x="640" y="412.5" text-anchor="middle"
          font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="22.7" fill="#EFECFF">{{CHAPTER_DESC}}</text>
  </g>

  <g id="brand-foot">
    <text x="640" y="638.3" text-anchor="middle"
          font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18.7" font-weight="bold" fill="#D9D2FF">{{BRAND_MARK}}</text>
  </g>
</svg>
