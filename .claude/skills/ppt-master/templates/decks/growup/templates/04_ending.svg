<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="growup-master" data-pptx-master-name="GrowUp" data-pptx-layout="04_ending" data-pptx-layout-name="Ending">
  <!-- GrowUp - 04 Ending: warm ground, tall lilac oval, character key visual, outlined value chips -->

