<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="growup-master" data-pptx-master-name="GrowUp" data-pptx-layout="03d_content_five_topic" data-pptx-layout-name="Content Five Topic">
  <!-- GrowUp - 03d Five white topic cards on warm ground, purple-tint icon discs, closing caption -->

  <defs>
