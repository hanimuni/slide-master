  <rect id="panel-1" x="86.4" y="225.6" width="196.9" height="336" rx="15.4" fill="#FFFFFF" filter="url(#shadow-card)" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="panel-2" x="314" y="225.6" width="196.9" height="336" rx="15.4" fill="#FFFFFF" filter="url(#shadow-card)" data-pptx-layer="layout" data-pptx-editable="false"/>
