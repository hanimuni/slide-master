<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="growup-master" data-pptx-master-name="GrowUp" data-pptx-layout="03j_content_stat_grid" data-pptx-layout-name="Content Stat Grid">
  <!-- GrowUp - 03j Six white stat tiles (3x2) on warm ground: oversized purple figure + caption, closing note -->

  <defs>
    <filter id="shadow-tile" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6.7" flood-color="#C9BEEA" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect id="master-bg" width="1280" height="720" fill="#FFFFFF" data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="stat-ground" width="1280" height="720" fill="#FCEFE6" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="panel-1" x="86.4" y="220.8" width="337.1" height="168" rx="15.4" fill="#FFFFFF" filter="url(#shadow-tile)" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="panel-2" x="471.5" y="220.8" width="337.1" height="168" rx="15.4" fill="#FFFFFF" filter="url(#shadow-tile)" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="panel-3" x="856.5" y="220.8" width="337.1" height="168" rx="15.4" fill="#FFFFFF" filter="url(#shadow-tile)" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="panel-4" x="86.4" y="427.2" width="337.1" height="168" rx="15.4" fill="#FFFFFF" filter="url(#shadow-tile)" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="panel-5" x="471.5" y="427.2" width="337.1" height="168" rx="15.4" fill="#FFFFFF" filter="url(#shadow-tile)" data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="panel-6" x="856.5" y="427.2" width="337.1" height="168" rx="15.4" fill="#FFFFFF" filter="url(#shadow-tile)" data-pptx-layer="layout" data-pptx-editable="false"/>

  <g id="page-eyebrow">
    <text x="96" y="78.5" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16.7" font-weight="bold" letter-spacing="4" fill="#7C6BFF">{{EYEBROW}}</text>
  </g>

  <g id="title-slot" data-pptx-placeholder="title" data-pptx-placeholder-bounds="86 92 1104 86">
    <text id="title-carrier" data-pptx-placeholder-carrier="true" x="96" y="145.4"
          font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="40" font-weight="bold" fill="#1F1B2E">{{PAGE_TITLE}}</text>
  </g>

  <g id="stat-1">
    <text x="254.9" y="298.8" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="50.7" font-weight="bold" fill="#7C6BFF">{{STAT_1}}</text>
    <text x="254.9" y="357.5" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18.7" fill="#4A4658">{{STAT_1_LABEL}}</text>
  </g>
  <g id="stat-2">
    <text x="640" y="298.8" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="50.7" font-weight="bold" fill="#7C6BFF">{{STAT_2}}</text>
    <text x="640" y="357.5" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18.7" fill="#4A4658">{{STAT_2_LABEL}}</text>
  </g>
  <g id="stat-3">
