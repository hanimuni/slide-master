    <text x="254.9" y="563.9" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18.7" fill="#4A4658">{{STAT_4_LABEL}}</text>
  </g>
  <g id="stat-5">
    <text x="640" y="505.2" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="50.7" font-weight="bold" fill="#7C6BFF">{{STAT_5}}</text>
    <text x="640" y="563.9" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18.7" fill="#4A4658">{{STAT_5_LABEL}}</text>
  </g>
  <g id="stat-6">
