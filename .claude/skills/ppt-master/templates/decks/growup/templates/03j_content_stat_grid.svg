    <text x="1025" y="357.5" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18.7" fill="#4A4658">{{STAT_3_LABEL}}</text>
  </g>
  <g id="stat-4">
