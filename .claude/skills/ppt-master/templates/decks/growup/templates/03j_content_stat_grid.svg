    <text x="1025" y="563.9" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18.7" fill="#4A4658">{{STAT_6_LABEL}}</text>
  </g>

  <g id="closing-note">
    <text x="640" y="662.3" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18.7" fill="#8A8696">{{SUMMARY_NOTE}}</text>
  </g>

  <g id="page-foot">
    <text x="1232" y="689.4" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12" fill="#8A8696">{{PAGE_NUM}}</text>
