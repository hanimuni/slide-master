    <text x="744" y="356.2" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="19.3" fill="#4A4658">{{VALUE_2}}</text>
  </g>
  <g id="kv-row-3">
    <rect x="537.6" y="399.4" width="177.6" height="53.8" rx="26.9" fill="#7C6BFF"/>
    <text x="626.4" y="430.7" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">{{KEY_3}}</text>
    <text x="744" y="431.1" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="19.3" fill="#4A4658">{{VALUE_3}}</text>
  </g>
  <g id="kv-row-4">
    <rect x="537.6" y="474.2" width="177.6" height="53.8" rx="26.9" fill="#7C6BFF"/>
    <text x="626.4" y="505.6" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">{{KEY_4}}</text>
    <text x="744" y="506" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="19.3" fill="#4A4658">{{VALUE_4}}</text>
  </g>
  <g id="kv-row-5">
